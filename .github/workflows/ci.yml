name: tests

# Minutes economy (from the dev tree, 28 Aug 2026): an unfiltered `push:` +
# `pull_request:` ran the suite TWICE per branch push. Branch pushes now run
# once (as the PR check); pushes to main (= merges) keep their run as the
# green-main signal; force-pushes cancel the superseded run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install numpy
      - name: Run regression suite
        run: python tests/run_tests.py
